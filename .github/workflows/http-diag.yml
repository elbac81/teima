name: HTTPS diagnostic (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live responses
        run: |
          echo "=== HEAD / ==="
          curl -sD - -o /dev/null https://teima.space/
          echo
          echo "=== GET / (first 1000 bytes) ==="
          curl -s https://teima.space/ | head -c 1000
          echo
          echo "=== HEAD /index.html ==="
          curl -sD - -o /dev/null https://teima.space/index.html
          echo
          echo "=== HEAD /README.md ==="
          curl -sD - -o /dev/null https://teima.space/README.md
          echo
          echo "=== HEAD over plain HTTP (not https) ==="
          curl -sD - -o /dev/null http://teima.space/
