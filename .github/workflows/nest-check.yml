name: Check for nested public_html (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List everything
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== account root ==="
          curl -s "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD"
          echo
          echo "=== public_html/ ==="
          curl -s "ftp://$FTP_HOST/public_html/" --user "$FTP_USERNAME:$FTP_PASSWORD"
          echo
          echo "=== public_html/ensaios/ ==="
          curl -s "ftp://$FTP_HOST/public_html/ensaios/" --user "$FTP_USERNAME:$FTP_PASSWORD"
          echo
          echo "=== public_html/public_html/ (nested theory) ==="
          curl -s "ftp://$FTP_HOST/public_html/public_html/" --user "$FTP_USERNAME:$FTP_PASSWORD"
          echo
          echo "=== public_html/public_html/ensaios/ (nested theory) ==="
          curl -s "ftp://$FTP_HOST/public_html/public_html/ensaios/" --user "$FTP_USERNAME:$FTP_PASSWORD"
