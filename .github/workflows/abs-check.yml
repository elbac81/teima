name: Absolute-path FTP check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List with true absolute paths
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== login CWD (PWD) ==="
          curl -s --disable-epsv -Q PWD "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD" -v 2>&1 | grep -E "^(25|257|<|>)"
          echo
          echo "=== TRUE absolute root (//) ==="
          curl -s "ftp://$FTP_HOST//" --user "$FTP_USERNAME:$FTP_PASSWORD" || echo "FAILED exit $?"
          echo
          echo "=== TRUE absolute /public_html (//public_html/) ==="
          curl -s "ftp://$FTP_HOST//public_html/" --user "$FTP_USERNAME:$FTP_PASSWORD" || echo "FAILED exit $?"
          echo
          echo "=== relative from login dir, no leading extra (just public_html/) ==="
          curl -s "ftp://$FTP_HOST/./public_html/" --user "$FTP_USERNAME:$FTP_PASSWORD" || echo "FAILED exit $?"
