name: Check /ensaios/ (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live responses
        run: |
          echo "=== HEAD /ensaios/ ==="
          curl -sD - -o /dev/null https://teima.space/ensaios/
          echo
          echo "=== GET /ensaios/ (first 1500 bytes) ==="
          curl -s https://teima.space/ensaios/ | head -c 1500
          echo
          echo "=== HEAD /ensaios/assets/js/site.js ==="
          curl -sD - -o /dev/null https://teima.space/ensaios/assets/js/site.js
          echo
          echo "=== GET /ensaios/api.php (first 500 bytes) ==="
          curl -s https://teima.space/ensaios/api.php | head -c 500
