name: Remove site files from account root (temporary)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete leftover sync-state file at account root
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl -s -Q "DELE .ftp-deploy-sync-state.json" "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          echo "=== final account root listing ==="
          curl -s --list-only "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
