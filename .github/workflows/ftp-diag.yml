name: FTP diagnostic (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe true docroot
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== first 2000 bytes of default.php ==="
          curl -s "ftp://$FTP_HOST/default.php" --user "$FTP_USERNAME:$FTP_PASSWORD" | head -c 2000 || true
          echo
          echo "=== uploading root-marker.txt to account root (sibling of default.php) ==="
          echo "marker-from-account-root" > /tmp/root-marker.txt
          curl -s -T /tmp/root-marker.txt "ftp://$FTP_HOST/root-marker.txt" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          echo "upload exit: $?"
          echo "=== confirm it landed in account root ==="
          curl -s --list-only "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
