name: FTP diagnostic (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Remove leftover diagnostic/default files
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== deleting root-marker.txt ==="
          curl -s -Q "DELE root-marker.txt" "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          echo "=== deleting default.php (Hostinger placeholder) ==="
          curl -s -Q "DELE default.php" "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          echo "=== deleting stale files left in public_html/ from the earlier wrong deploy ==="
          for f in api.php index.html README.md .ftp-deploy-sync-state.json; do
            curl -s -Q "DELE public_html/$f" "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          done
          for f in assets/css/style.css assets/js/site.js assets/img/teima_logo.jpg dados/musicas.json dados/.htaccess; do
            curl -s -Q "DELE public_html/$f" "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          done
          for d in assets/css assets/js assets/img assets dados public_html; do
            curl -s -Q "RMD public_html/$d" "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          done
          echo "=== final root listing ==="
          curl -s --list-only "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
