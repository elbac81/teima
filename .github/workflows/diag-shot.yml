name: Diag screenshot
on: workflow_dispatch
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright@1.47.0
      - run: npx playwright install --with-deps chromium
      - run: node shot.js
      - name: dump base64
        run: |
          echo TOP_START
          base64 -w0 root-top.png
          echo TOP_END
          echo SCROLLED_START
          base64 -w0 root-scrolled.png
          echo SCROLLED_END
