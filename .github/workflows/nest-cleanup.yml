name: Remove duplicated nested public_html (temporary)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old nested public_html/ensaios copy
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          BASE="public_html/ensaios"
          for f in "$BASE/api.php" "$BASE/index.html" "$BASE/README.md" "$BASE/.ftp-deploy-sync-state-ensaios.json"; do
            curl -s -Q "DELE $f" "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          done
          for f in "$BASE/assets/css/style.css" "$BASE/assets/js/site.js" "$BASE/assets/img/teima_logo.jpg" "$BASE/dados/musicas.json" "$BASE/dados/.htaccess"; do
            curl -s -Q "DELE $f" "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          done
          for d in "$BASE/assets/css" "$BASE/assets/js" "$BASE/assets/img" "$BASE/assets" "$BASE/dados" "$BASE" "public_html"; do
            curl -s -Q "RMD $d" "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          done
          echo "=== final public_html (real, via absolute //) listing ==="
          curl -s "ftp://$FTP_HOST//public_html/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          echo
          echo "=== ensaios (correct location) listing ==="
          curl -s "ftp://$FTP_HOST/ensaios/" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
