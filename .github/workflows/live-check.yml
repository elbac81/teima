name: Live site check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List current public_html contents
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== public_html listing ==="
          curl -s "ftp://$FTP_HOST/public_html/" --user "$FTP_USERNAME:$FTP_PASSWORD"
          echo
          echo "=== account root listing ==="
          curl -s "ftp://$FTP_HOST/" --user "$FTP_USERNAME:$FTP_PASSWORD"
