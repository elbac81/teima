name: Diag bg check
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: check css cache-busted vs bare
        run: |
          set +e
          echo "---BARE HEADERS---"
          curl -sI --max-time 20 "https://teima.space/site.css"
          echo "---BARE LENGTH---"
          curl -s --max-time 20 "https://teima.space/site.css" | wc -c
          echo "---BARE social-row---"
          curl -s --max-time 20 "https://teima.space/site.css" | grep -A8 "social-row"
          echo "---BUSTED LENGTH---"
          curl -s --max-time 20 "https://teima.space/site.css?x=$(date +%s)" | wc -c
          echo "---BUSTED social-row---"
          curl -s --max-time 20 "https://teima.space/site.css?x=$(date +%s)" | grep -A8 "social-row"
          echo "---HTML site.css ref---"
          curl -s --max-time 20 "https://teima.space/?x=$(date +%s)" | grep -i "site.css"
          exit 0
