name: Diag bg check
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: verify changes
        run: |
          echo "--- artist-field remnants in CSS ---"
          curl -s --max-time 20 -u teima:fareja "https://teima.space/ensaios/assets/css/style.css?v=7f25d95a81877a58a29ac17f65271bd75b034085" | grep -c 'artist-field' || true
          echo "--- body color rule ---"
          curl -s --max-time 20 -u teima:fareja "https://teima.space/ensaios/assets/css/style.css?v=7f25d95a81877a58a29ac17f65271bd75b034085" | grep -A3 '^body {'
          echo "--- artistInput / Cifra label remnants in JS ---"
          curl -s --max-time 20 -u teima:fareja "https://teima.space/ensaios/assets/js/site.js?v=7f25d95a81877a58a29ac17f65271bd75b034085" | grep -c 'artistInput\|field-label\">Cifra' || true
