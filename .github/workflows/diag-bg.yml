name: Diag bg check
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: POST merged musicas.json to live api.php
        run: |
          curl -sS --max-time 20 -X POST -H "Content-Type: application/json" --data-binary @dados/musicas.json https://teima.space/ensaios/api.php
          echo
          echo "--- verify GET back ---"
          curl -sS --max-time 20 https://teima.space/ensaios/api.php | head -c 1200
