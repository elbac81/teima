name: Diag bg check
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: recheck site.js versioned
        run: |
          echo "--- dropdown remnants in JS (versioned, bypass CDN cache) ---"
          curl -s --max-time 20 -u teima:fareja "https://teima.space/ensaios/assets/js/site.js?v=d4644556723e755314913eb17d8c552ea0fc7625" | grep -c 'renderSongList\|songDropdown' || true
