name: Diag bg check
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: verify logins and note isolation
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys

          def curl_get(user):
              out = subprocess.run(
                  ['curl', '-s', '--max-time', '20', '-u', f'{user}:fareja', 'https://teima.space/ensaios/api.php'],
                  capture_output=True, text=True
              )
              return json.loads(out.stdout)

          def curl_post(user, payload):
              out = subprocess.run(
                  ['curl', '-s', '--max-time', '20', '-u', f'{user}:fareja',
                   '-H', 'Content-Type: application/json',
                   '-X', 'POST', '--data-binary', '@-',
                   'https://teima.space/ensaios/api.php'],
                  input=json.dumps(payload), capture_output=True, text=True
              )
              return out.stdout

          # 1. confirm each of the 6 logins works and identifies correctly
          for user in ['teima', 'filipe', 'ricardo', 'hugo', 'tiago', 'vasco']:
              data = curl_get(user)
              print(f"{user}: HTTP user field = {data.get('user')!r}, notaPropria = {data.get('notaPropria')!r}")

          # 2. safe round-trip: read filipe's full state, only touch notaPropria, write it back, verify, then restore
          before = curl_get('filipe')
          original_note = before.get('notaPropria', '')
          payload = {
              'songs': before['songs'],
              'repertorios': before.get('repertorios', []),
              'eventos': before.get('eventos', []),
              'notasGerais': before.get('notasGerais', ''),
              'notaPropria': 'TESTE_PRIVACIDADE_FILIPE',
          }
          curl_post('filipe', payload)

          after_filipe = curl_get('filipe')
          after_ricardo = curl_get('ricardo')
          print(f"after write -> filipe notaPropria = {after_filipe.get('notaPropria')!r}")
          print(f"after write -> ricardo notaPropria = {after_ricardo.get('notaPropria')!r} (should be untouched)")

          ok = after_filipe.get('notaPropria') == 'TESTE_PRIVACIDADE_FILIPE' and after_ricardo.get('notaPropria') != 'TESTE_PRIVACIDADE_FILIPE'
          print('ISOLATION_OK' if ok else 'ISOLATION_FAILED')

          # 3. restore filipe's original note so we leave no test data behind
          restore_payload = dict(payload)
          restore_payload['notaPropria'] = original_note
          curl_post('filipe', restore_payload)
          restored = curl_get('filipe')
          print(f"restored filipe notaPropria = {restored.get('notaPropria')!r} (should match original {original_note!r})")
          PYEOF
