name: Diag bg check
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: check letras deployed
        run: |
          curl -s --max-time 20 -u teima:fareja "https://teima.space/ensaios/assets/js/site.js?x=$(date +%s)" | grep -o 'LETRAS_LIST_PATH[^;]*;' | head -3
          curl -s --max-time 20 -u teima:fareja "https://teima.space/ensaios/" | grep -A1 'letrasLink'
