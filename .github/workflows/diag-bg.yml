name: Diag bg check
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: curl nav pages
        run: |
          for u in https://teima.space/favicon.ico https://teima.space/socials/ https://teima.space/musica/ https://teima.space/videos/ https://teima.space/sobre/ https://teima.space/site.css; do
            echo "--- $u ---"
            curl -sD - -o /dev/null "$u"
          done
