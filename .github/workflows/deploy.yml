name: Deploy to teima.space (FTP)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload via FTP (ensaios)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ensaios/
          state-name: .ftp-deploy-sync-state-ensaios.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            root-page/**

      - name: Upload via FTP (domain root landing page)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: root-page/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-root.json
