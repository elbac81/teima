name: Deploy to teima.space (FTP)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp cache-busting build id
        run: |
          sed -i "s/__BUILD__/${{ github.sha }}/g" index.html
          grep -rl '__BUILD__' root-page/ | xargs -r sed -i "s/__BUILD__/${{ github.sha }}/g"

      - name: Upload via FTP (privado)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: privado/
          state-name: .ftp-deploy-sync-state-privado.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            root-page/**
            dados/musicas.json

      - name: Upload via FTP (domain root landing page)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: root-page/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-root.json
