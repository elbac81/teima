name: Check for stray root-page in ensaios (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List ensaios/ contents
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl -s "ftp://$FTP_HOST/ensaios/" --user "$FTP_USERNAME:$FTP_PASSWORD"
