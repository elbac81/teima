<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notas de Ensaio — Teima</title>
  <meta name="description" content="Estrutura, acordes, tom e notas de ensaio das músicas da Teima." />
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/favicon-180.png">
  <link rel="stylesheet" href="assets/css/style.css?v=__BUILD__" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="wordmark-img" src="assets/img/teima_logo.jpg" alt="TEIMA">
      <span class="mark">notas de ensaio</span>
    </div>
    <details class="song-dropdown" id="songDropdown">
      <summary>
        <span class="dd-label">Músicas</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </summary>
      <div class="song-list" id="songList">
        <div class="rail-empty">A carregar…</div>
      </div>
    </details>
    <button class="new-song-btn" id="newSongBtn">+ Nova música</button>
    <div class="sync-status" id="syncStatus"><span class="sync-dot"></span><span class="label">—</span></div>
  </header>
  <main class="main" id="main">
    <div class="empty-state"></div>
  </main>
  <script src="assets/js/site.js?v=__BUILD__"></script>
</body>
</html>
