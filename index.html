<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notas de Ensaio — Teima</title>
  <meta name="description" content="Estrutura, acordes, tom e notas de ensaio das músicas da Teima." />
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="shell">
    <div class="rail">
      <div class="brand">
        <img class="wordmark-img" src="assets/img/teima_logo.jpg" alt="TEIMA">
        <span class="mark">notas de ensaio</span>
      </div>
      <button class="new-song-btn" id="newSongBtn">+ Nova música</button>
      <div class="song-list" id="songList">
        <div class="rail-empty">A carregar…</div>
      </div>
      <div class="sync-status" id="syncStatus"><span class="sync-dot"></span><span class="label">—</span></div>
    </div>
    <div class="main" id="main">
      <div class="empty-state">
        <span class="eyebrow">Notas de ensaio</span>
        <h2>Escolhe uma música ou cria uma nova.</h2>
        <p>Estrutura cada música por secções — intro, verso, refrão, solo, ponte, outro — com tom, acordes sobre a letra e notas de ensaio para cada uma.</p>
      </div>
    </div>
  </div>
  <script src="assets/js/site.js"></script>
</body>
</html>
