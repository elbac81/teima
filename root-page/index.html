<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teima</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }
    body {
      background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
        url("bg.jpg") center / cover no-repeat fixed;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      position: relative;
    }
    .logo {
      width: 100%;
      max-width: 300px;
      height: auto;
      display: block;
    }
    a.ensaios-link {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      color: #e8c34a;
      border: 1px solid rgba(232, 195, 74, 0.4);
      border-radius: 999px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    a.ensaios-link:hover {
      border-color: #e8c34a;
      background: rgba(232, 195, 74, 0.08);
    }
    a.ensaios-link svg {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <img class="logo" src="teima_logo.png" alt="TEIMA">
  <a class="ensaios-link" href="/ensaios/" aria-label="Notas de ensaio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="11" width="16" height="10" rx="2"></rect>
      <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
    </svg>
  </a>
</body>
</html>
